name: Gerar feed do Google Shopping

on:
  schedule:
    # Roda todo dia às 05:00 UTC (02:00 no horário de Brasília)
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  gerar-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar feed.xml
        env:
          LI_PERSONAL_TOKEN: ${{ secrets.LI_PERSONAL_TOKEN }}
        run: python generate_feed.py

      - name: Commitar e enviar feed.xml atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet --cached || git commit -m "Atualiza feed.xml automaticamente"
          git pull --rebase origin main
          git push
